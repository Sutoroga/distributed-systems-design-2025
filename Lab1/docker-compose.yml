services:
  facade_service:
    build: ./facade_service
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - logging_service
      - messages_service

  logging_service:
    build: logging_service
    ports:
      - "8001:8001"
    env_file:
      - .env

  messages_service:
    build: messages_service
    ports:
      - "8002:8002"
    env_file:
      - .env
